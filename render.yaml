services:
  - type: web
    name: tamil-buddy
    runtime: python
    plan: free
    buildCommand: "npm install && npm run build && pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: NODE_VERSION
        value: 20.11.1
